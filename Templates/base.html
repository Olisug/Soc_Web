<!DOCTYPE html>
<html lang='ru'>
{%load static%}
<link rel='stylesheet' href='/static/css/stylesheet.сss' type="text/css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <head>
    <link rel="stylesheet" type="text/css" href="{% static 'css/stylesheet.css' %}">
    {%block title%}<title>Главная страница</title>{%endblock%}
  </head>
  <body class='body'>
    {% include 'navigation.html' %}
    <main class='main'>
      {% block content %}{% endblock %}
      {% block extra_js %}
      <!-- Вставьте это в base.html перед другими скриптами -->
        <script>
        function getCSRFToken() {
            const csrfTokenElement = document.querySelector('[name=csrfmiddlewaretoken]');
            if (csrfTokenElement) {
                return csrfTokenElement.value;
            }
            
            // Альтернативный способ получения CSRF токена
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, 10) === 'csrftoken=') {
                        cookieValue = decodeURIComponent(cookie.substring(10));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        </script>
      {% endblock %}
    </main>
  </body>
</html>
