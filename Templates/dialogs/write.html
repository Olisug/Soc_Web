{% extends "base.html" %}
{% load static %}

{% block title %}<title>Написать сообщение - Social Network</title>{% endblock %}

{% block content %}
<div class="write-message-container">
    <div class="write-header">
        <h1>✏️ Написать сообщение</h1>
        <a href="{% url 'Dialogs:messages' %}" class="back-btn">← Назад</a>
    </div>

    <div class="friends-select">
        <h3>Выберите получателя:</h3>
        <select id="receiver-select">
            <option value="">-- Выберите друга --</option>
            {% for friend in friends1 %}
            <option value="{{ friend.users_friend.username }}">{{ friend.users_friend.username }}</option>
            {% endfor %}
            {% for friend in friends2 %}
            <option value="{{ friend.user.username }}">{{ friend.user.username }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="message-compose">
        <textarea id="message-text" placeholder="Введите ваше сообщение..." maxlength="500"></textarea>
        <button id="send-message-btn" disabled>Отправить сообщение</button>
    </div>
</div>
{% endblock %}
